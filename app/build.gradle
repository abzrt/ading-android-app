plugins {
    id("com.android.application")
}

def versionPropsFile = file('version.properties')
def versionMajor = 1
def versionMinor = 0
def versionPatch = 4

if (versionPropsFile.canRead()) {
    Properties versionProps = new Properties()
    versionPropsFile.withInputStream { versionProps.load(it) }
    versionMajor = versionProps['VERSION_MAJOR'].toInteger()
    versionMinor = versionProps['VERSION_MINOR'].toInteger()
    versionPatch = versionProps['VERSION_PATCH'].toInteger()

    def runTasks = gradle.startParameter.taskNames
    if (runTasks.any { it.toLowerCase().contains("release") }) {
        versionPatch += 1
        versionProps['VERSION_PATCH'] = versionPatch.toString()
        versionProps.remove('BUILD_NUMBER')
        versionPropsFile.withOutputStream { versionProps.store(it, "Auto-incremented release version") }
    }
}

android {
    namespace = "id.web.ading"
    compileSdk = 35

    defaultConfig {
        applicationId = "id.web.ading"
        minSdk = 24
        targetSdk = 35
        versionCode = versionPatch
        versionName = "${versionMajor}.${versionMinor}.${versionPatch}"

        base.archivesName = "Ading Mobile-v${versionName}"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file("ading-release-key.jks")
            storePassword "AdingTelkom2026!"
            keyAlias "ading_release"
            keyPassword "AdingTelkom2026!"
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ""
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.activity:activity:1.9.3'
}

afterEvaluate {
    tasks.named("assembleRelease").configure {
        doLast {
            def releaseDir = file("${buildDir}/outputs/apk/release")
            def apkFile = new File(releaseDir, "Ading Mobile-v${android.defaultConfig.versionName}-release.apk")
            if (apkFile.exists()) {
                copy {
                    from apkFile
                    into rootProject.projectDir
                    rename { "Ading Mobile.apk" }
                }
            }
        }
    }
}

